<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#e900c8">
<title>BIP-SMOP · Твой следующий бип</title>
<style>
:root{--pink:#ff00c8;--lime:#d5ff00;--cyan:#00dfff;--ink:#101017}
*{box-sizing:border-box}
body{margin:0;background:#10101d;color:white;font:15px Arial,sans-serif}
button,input,textarea{font:inherit}
button{cursor:pointer;color:inherit}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--cyan);outline-offset:4px}
button{border:0}
header{height:80px;display:flex;gap:26px;align-items:center;padding:10px 24px;border-bottom:2px solid var(--cyan);background:#101017;position:relative;z-index:2}
.logo{font-size:43px;font-weight:1000;letter-spacing:-3px;white-space:nowrap;transform:rotate(-4deg);color:var(--lime);-webkit-text-stroke:1px #fff;text-shadow:3px 3px #000,5px 5px var(--pink),-3px -3px var(--pink)}
.logo span{color:var(--cyan)}
.search{display:flex;max-width:560px;flex:1;margin:auto;border:1px solid #727184;border-radius:8px;background:#22222d;overflow:hidden}
.search input{width:100%;min-width:0;padding:12px;color:white;background:none;border:0}
.search button{background:none;font-size:24px;padding:0 14px}
.acid{background:var(--lime);color:#141414;font-weight:800;padding:12px 18px;border-radius:7px;box-shadow:3px 3px 0 var(--pink)}
.avatar{width:43px;height:43px;border-radius:50%;object-fit:cover;border:2px solid var(--cyan)}
.layout{display:grid;grid-template-columns:255px minmax(400px,1fr) 330px;min-height:calc(100svh - 80px)}
aside.sidebar{background:#101017ef;border-right:1px solid #824c96;padding:24px 16px;z-index:1}
.nav{display:flex;flex-direction:column;gap:10px}
.nav button{background:none;text-align:left;padding:13px 12px;border-radius:7px;font-weight:700;font-size:17px}
.nav button.active{background:var(--lime);color:#111;box-shadow:0 0 15px #ff00b9}
.nav i{font-style:normal;font-size:25px;display:inline-block;width:37px}
.badge{float:right;background:var(--pink);border-radius:20px;padding:3px 9px}
.following{border-top:1px solid #735286;margin-top:28px;padding-top:12px}
.following h2{font-size:19px}
.person{display:grid;grid-template-columns:43px 1fr;gap:10px;align-items:center;margin:18px 0}
.person strong{font-size:13px}
.follow{background:var(--lime);color:#111;border-radius:6px;padding:7px 9px;font-size:12px;font-weight:bold;margin-top:6px}
.stamps{width:100%;height:240px;object-fit:cover;object-position:top;border:5px ridge #beb1fc;transform:rotate(-4deg);margin-top:23px}
.canvas{position:relative;isolation:isolate;display:flex;justify-content:center;align-items:flex-start;padding:28px 18px 36px 35px;gap:13px;overflow:hidden;background:repeating-linear-gradient(127deg,transparent 0 35px,#ff00c844 36px 39px,transparent 40px 70px),radial-gradient(ellipse at 25% 20%,#13ddff 0,transparent 46%),linear-gradient(140deg,#052e7b,#592481 45%,#ff07b2)}
.canvas:before{content:'✦';position:absolute;left:-13px;top:110px;color:#ffe600;font-size:120px;text-shadow:3px 3px #ff00bf;z-index:-1;transform:rotate(-17deg)}
.disc{width:160px;height:160px;border-radius:50%;background:repeating-conic-gradient(#e9e3ff,#69687b 15deg,#72f5e4 34deg,#eb93e3 55deg,#fff 72deg);box-shadow:inset 0 0 0 2px #e7efff,0 0 20px #00eaff;position:absolute;left:-75px;bottom:50px;z-index:-1}
.disc:after{content:'';position:absolute;inset:39%;background:#171724;border:8px ridge #bfc6da;border-radius:50%}
.player-wrap{width:min(100%,420px)}
.player{position:relative;aspect-ratio:9/16;border-radius:15px;overflow:hidden;background:#050507;box-shadow:0 0 0 2px #081019,0 0 0 5px #00bfff,10px 10px 0 #141322}
.media{width:100%;height:100%;object-fit:cover;display:block}
.player video{display:none}
.creator{position:absolute;left:0;top:0;width:100%;padding:15px;display:flex;gap:10px;align-items:center;background:linear-gradient(#000a,transparent)}
.creator strong{font-size:13px}
.creator small{display:block;margin-top:5px;color:#ddd}
.tick{color:var(--lime)}
.caption{position:absolute;bottom:0;left:0;width:100%;padding:38px 15px 15px;background:linear-gradient(transparent,#000e)}
.caption p{font-weight:700}
.playback{display:flex;gap:10px;align-items:center;font-size:11px}
.playback button{background:none;color:var(--lime);font-size:23px;padding:0}
.playback input{width:100%;accent-color:var(--lime);min-width:0}
.creator-bar{display:flex;align-items:center;justify-content:space-between;padding:14px 10px;margin-top:5px;background:#11111b;border-radius:0 0 12px 12px;gap:8px}
.creator-bar small{color:#a9a4b8;display:block;margin-top:4px}
.pink{background:var(--pink);padding:11px 19px;border-radius:24px;font-weight:bold}
.actions{align-self:center;display:flex;flex-direction:column;gap:20px;background:#11111be8;padding:13px 8px;border-radius:30px;margin-top:80px}
.action{display:flex;flex-direction:column;align-items:center;gap:4px;background:none;padding:4px;font-size:12px}
.action .symbol{font-size:33px}
.action[aria-pressed=true] .symbol{color:var(--pink);text-shadow:0 0 12px var(--pink)}
.action small{color:#c7bfd1}
.right{padding:27px 20px;background:repeating-linear-gradient(160deg,#491a6233 0 20px,#ff00c866 21px 22px),linear-gradient(135deg,#06b9f0,#351760 48%,#fa00b8);overflow:hidden}
.window{border:4px ridge #d8ceff;background:#11111c;box-shadow:6px 6px #161325;margin-bottom:30px}
.window-title{display:flex;align-items:center;justify-content:space-between;padding:8px 9px;color:#111;background:linear-gradient(#ffb8f5,#ff24c8);font-weight:1000;font-size:22px;letter-spacing:-1px;text-shadow:1px 1px #fff}
.window-title span{font-size:14px;background:#ded7f0;border:2px outset #fff;color:#141414;padding:0 5px}
.day{transform:rotate(-3deg)}
.day-photo{height:230px;position:relative}
.day-photo img{width:100%;height:100%;object-fit:cover;object-position:50% 35%}
.day-photo b{position:absolute;bottom:12px;left:12px;background:#111;padding:6px 12px;border-radius:6px}
.meter .window-title{background:linear-gradient(#c1faff,#009fff);color:#ff00b8;text-shadow:1px 1px white}
.gauge{margin:25px auto 8px;width:230px;height:115px;border-radius:130px 130px 0 0;background:conic-gradient(from 270deg at 50% 100%,#cfff00 0deg,#00ffce 80deg,#ff00d4 160deg,#ff00d4 180deg,transparent 180deg);position:relative;overflow:hidden}
.gauge:after{content:'';position:absolute;inset:21px 21px 0;background:#11111c;border-radius:100px 100px 0 0}
.gauge strong{position:absolute;z-index:1;bottom:0;width:100%;text-align:center;font-size:48px}
.meter p{color:#ff30d0;font-weight:bold;text-align:center}
.mini-note{margin:38px 12px 0;transform:rotate(5deg);border:3px ridge #fff;background:#dcff00;color:#111;padding:18px;box-shadow:8px 8px #5314ad;font-family:monospace;font-size:21px}
.mini-note span{font-size:48px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);max-width:90%;padding:13px 22px;border:2px solid var(--cyan);background:#151020;border-radius:8px;z-index:10;box-shadow:5px 5px var(--pink)}
.toast[hidden]{display:none}
dialog{color:white;background:#15111e;border:3px ridge var(--pink);border-radius:8px;width:min(480px,92vw);box-shadow:10px 10px #00ddff55}
dialog::backdrop{background:#000b}
dialog h2{margin-top:0;color:var(--lime)}
.close{float:right;background:none;font-size:25px}
textarea{width:100%;min-height:85px;padding:10px;background:#282233;color:white;border:1px solid #726282;border-radius:7px;margin:12px 0}
.comment{padding:10px 0;border-bottom:1px solid #50455f;overflow-wrap:anywhere}
.note{color:#b4a8c4;font-size:13px;line-height:1.5}
.empty{display:none;padding:40px;text-align:center;background:#16101ce8;border:2px solid var(--pink)}
[hidden]{display:none!important}

@media(min-width:1500px){
    .layout{grid-template-columns:285px 1fr 390px}
    .player-wrap{width:450px}
    .right{padding:30px}
    .day-photo{height:270px}
}
@media(max-width:1100px){
    .layout{grid-template-columns:210px 1fr}
    .right{display:none}
    .canvas{padding-left:20px}
    .logo{font-size:34px}
    header{gap:15px}
}
@media(max-width:700px){
    header{height:67px;padding:10px 12px;gap:10px}
    .logo{font-size:29px;letter-spacing:-2px}
    .search{display:none}
    header>.avatar{display:none}
    header>.acid{margin-left:auto;font-size:12px;padding:9px}
    .layout{display:block}
    .sidebar{padding:0!important;border:0!important}
    .nav{flex-direction:row;justify-content:space-around;padding:8px 4px;gap:0}
    .nav button{font-size:10px;padding:7px}
    .nav i{display:block;width:auto;text-align:center;font-size:22px}
    .badge{display:none}
    .following,.stamps{display:none}
    .canvas{padding:13px 10px 25px;gap:6px}
    .player-wrap{width:min(calc(100vw - 75px),390px)}
    .actions{padding:8px 3px;gap:16px}
    .action{font-size:9px}
    .action .symbol{font-size:27px}
    .creator-bar{font-size:11px}
    .pink{padding:9px 12px;font-size:11px}
    .creator-bar .avatar{width:32px;height:32px}
    .creator{padding:10px}
    .creator strong{font-size:11px}
    .caption p{font-size:12px}
    .playback{font-size:9px}
}
@media(prefers-reduced-motion:no-preference){
    button{transition:filter .15s,transform .15s}
    button:hover{filter:brightness(1.15);transform:translateY(-1px)}
}

/* Compact, aligned Y2K sidebar */
.right{display:flex;flex-direction:column;gap:14px;padding:27px 18px;align-items:stretch}
.right .window{margin:0;width:100%;transform:none;flex-shrink:0;box-shadow:4px 4px #161325}
.window-title{font-size:18px;padding:6px 8px;letter-spacing:-.4px}
.day-photo{height:230px}
.meter{position:relative;min-height:94px}
.meter .gauge{width:100px;height:50px;margin:8px 0 7px 14px}
.meter .gauge:after{inset:10px 10px 0}
.meter .gauge strong{font-size:25px}
.meter p{position:absolute;right:10px;bottom:12px;font-size:12px;max-width:100px;margin:0}
.smoper .window-title{background:linear-gradient(#f5ffb9,#b7f400)}
.smoper-body{display:flex;align-items:center;gap:10px;padding:9px}
.smoper-body small{display:block;font-size:10px;color:#c6c6e1;margin-top:4px}
.smoper-body .avatar{width:42px;height:42px}
.crown{font-size:30px;color:#ffdc00;margin-left:auto}
.bip-banner{background:linear-gradient(120deg,#eeff00,#6dff00 45%,#00eaff)!important}
.bip-banner button{width:100%;padding:9px 4px;color:#251044;background:repeating-linear-gradient(45deg,transparent 0 12px,#fff3 12px 14px);display:grid;gap:2px;text-align:center}
.bip-banner small{font:bold 9px monospace;letter-spacing:3px}
.bip-banner strong{font-size:27px;font-style:italic;text-shadow:2px 2px white,3px 3px #ff00a8}
.bip-banner span{font-size:11px;font-weight:bold}
.soda-ad,.burger-ad{position:relative;isolation:isolate;overflow:hidden;min-height:139px;padding:10px;color:white}
.soda-ad{background:radial-gradient(circle at 80% 50%,#ff78d8,transparent 45%),repeating-linear-gradient(135deg,#620fbe 0 17px,#7a0bd4 17px 34px)!important}
.ad-copy{position:relative;z-index:1;width:72%}
.soda-ad small,.burger-ad small{font-size:8px;letter-spacing:1px}
.soda-ad h2,.burger-ad h2{font-size:24px;line-height:.94;font-style:italic;margin:6px 0;text-shadow:2px 2px #710848,-1px -1px #fff6}
.soda-ad p{font-size:10px;margin:6px 0}
.soda-ad b{font-size:10px;color:#e4ff00}
.can{position:absolute;right:17px;top:19px;width:57px;height:105px;border-radius:12px 12px 15px 15px;border-top:5px ridge #ddd;border-bottom:5px ridge #ccc;transform:rotate(13deg);background:linear-gradient(90deg,#830a4e,#ff147f 35%,#ff98bc 55%,#b10054);box-shadow:5px 5px 0 #21082966;text-align:center;padding-top:15px}
.can span{display:block;font-size:13px;font-weight:900;font-style:italic;line-height:1}
.can small{display:block;margin-top:12px;font-size:8px!important}
.burger-ad{min-height:124px;background:repeating-conic-gradient(from 15deg at 80% 70%,#ffb900 0deg 15deg,#ff7600 15deg 30deg)!important;color:#501324}
.burger-ad h2{color:white;font-size:25px}
.burger-ad b{font-size:9px;background:#ffec00;padding:3px}
.burger{position:absolute;right:10px;bottom:20px;width:87px;transform:rotate(-9deg);filter:drop-shadow(4px 5px 0 #8c2a2080)}
.burger i{display:block;height:10px;border-radius:8px;background:#924323}
.burger i:first-child{height:32px;border-radius:55px 55px 8px 8px;background:radial-gradient(ellipse,#fff2ad 1px,transparent 2px) 0 0/14px 11px,#f5ac3c;border-bottom:3px solid #e98920}
.burger i:nth-child(2){background:#91ce25;height:8px}
.burger i:nth-child(3){background:#e32d29;height:7px}
.burger i:last-child{background:#e89b35;height:14px}
.new-badge{position:absolute;right:7px;top:10px;background:#e9ff00;color:#d81b68;border:2px solid #fff;transform:rotate(12deg);padding:4px;font-size:11px;font-weight:900}

@media(min-width:1500px){
    .right{padding:28px 24px}
    .day-photo{height:270px}
}
@media(min-width:701px) and (max-width:1100px){
    .layout{grid-template-columns:200px minmax(360px,1fr)}
    .right{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));align-items:start}
    .day{grid-row:span 2}
    .day-photo{height:200px}
}
@media(max-width:700px){
    .right{display:grid;grid-template-columns:1fr;gap:14px;padding:18px}
    .right .window{max-width:390px;justify-self:center}
    .day-photo{height:260px}
}

/* Rounded glossy panels and expanded feed */
.right{align-self:start;position:sticky;top:0}
.right .window{border:2px solid #bdb2f0;border-radius:22px;overflow:hidden;box-shadow:inset 0 1px 2px #fff8,0 6px 0 #22113e66,0 0 16px #e900c844}
.window-title{padding:10px 13px;background:linear-gradient(#ffd5fa,#ff48d8 48%,#e900be 49%,#ff67df);font-size:17px}
.window-title span{border-radius:5px}
.day-photo{margin:8px;border-radius:14px;overflow:hidden;height:210px}
.card-details{padding:3px 13px 13px;display:grid;gap:5px}
.card-details b{font-size:12px;color:#edff2d}
.card-details span,.card-details small{font-size:10px;color:#d2bddf}
.meter p{bottom:39px}
.meter-details{display:flex;justify-content:space-between;font:8px monospace;padding:4px 12px 10px;color:#baffd5}
.daily-smop{display:flex;gap:12px;padding:10px;width:100%;background:linear-gradient(120deg,#2b1251,#5d1468);text-align:left;align-items:center}
.daily-smop img{width:94px;height:85px;object-fit:cover;border:2px solid #e6ff00;border-radius:14px}
.daily-smop span{display:grid;gap:7px}
.daily-smop small{color:#e4c8fb;font-size:11px}
.daily-smop strong{font-size:26px;color:#eaff00}
.daily-smop b{font-size:10px}
.tags{padding:7px 10px;font:9px monospace;color:#55edff}
.banner-tags{text-align:center;font-size:10px;color:#3c1750;padding:0 4px 10px}
.bip-banner button{padding:13px 4px 7px}
.soda-ad,.burger-ad{min-height:170px;padding:14px}
.ad-footer{position:relative;z-index:2;margin-top:16px;font:bold 8px monospace;padding:7px 0 0;border-top:1px solid #ffffff66}
.burger-ad .burger{bottom:45px}
.soda-ad .can{top:26px}
.feed-post{margin-top:30px;background:#16101e;border:2px solid #00eaff;border-radius:22px;overflow:hidden;box-shadow:7px 7px #17112699;scroll-margin-top:15px}
.post-top{display:flex;align-items:center;gap:10px;padding:13px;background:linear-gradient(#3d2855,#171123)}
.post-top strong{font-size:13px}
.post-top small{display:block;font-size:10px;color:#c8b2dd;margin-top:4px}
.post-top>span{margin-left:auto;color:#dfff00;font-size:25px}
.post-photo{aspect-ratio:9/16;background:#09060d;display:flex;align-items:center}
.post-photo img{width:100%;height:100%;object-fit:contain}
.post-copy{padding:12px}
.post-copy p{font-size:13px;line-height:1.5;margin:0 0 12px}
.post-tools{display:flex;gap:6px;flex-wrap:wrap}
.post-tools button{background:#392147;padding:9px 8px;border-radius:16px;font-size:11px;border:1px solid #c54bec}
.post-tools button[aria-pressed=true]{background:#ff15b0}
.comment-peek{background:transparent;color:#baa0ce;font-size:10px;padding:12px 0 0}
.actions{align-self:flex-start;position:sticky;top:25px;margin-top:260px}
.chat-head{display:flex;gap:10px;align-items:center;padding:10px;background:#36234a;border-radius:15px}
.chat-head small{display:block;color:#c9ff5e;margin-top:5px}
.chat-log{max-height:45vh;overflow:auto;display:flex;flex-direction:column;gap:10px;padding:20px 0}
.bubble{max-width:85%;padding:13px 16px;background:#4c306a;border-radius:18px 18px 18px 4px;overflow-wrap:anywhere;line-height:1.4}
.bubble.mine{align-self:flex-end;background:#caef26;color:#202018;border-radius:18px 18px 4px 18px}
.chat-note{font-size:10px;color:#c3aacf}
.comment strong{color:#d9ff00;font-size:12px}
.comment p{margin:7px 0;font-size:14px}
dialog{border-radius:22px}
.nav .badge{font-size:12px}
.following{position:sticky;top:20px}
@media(max-width:1100px){.right{position:static}.following{position:static}}
@media(max-width:700px){
    .actions{margin-top:200px;top:12px}
    .right{display:grid;grid-template-columns:1fr}
    .post-tools button{font-size:10px;padding:8px 6px}
    .post-top strong{font-size:11px}
    .right .window{width:100%}

/* Every post owns its controls and visible discussion. */
.canvas{display:block;padding:28px 24px}
.player-wrap{margin:0 auto;width:min(100%,440px)}
.main-post{scroll-margin-top:20px}
.actions{position:static;margin:12px 0 0;display:flex;flex-direction:row;justify-content:space-around;border-radius:20px;padding:8px}
.action{font-size:11px}
.action .symbol{font-size:24px}
.action small{font-size:10px}
.post-photo{aspect-ratio:auto;display:block;background:#101017}
.post-photo img{display:block;height:auto;max-height:640px;object-fit:contain}
.post-video{background:#090610}
.post-video video{display:block;width:100%;max-height:720px;aspect-ratio:9/16;object-fit:contain}
.inline-comments{padding:15px 13px;background:linear-gradient(145deg,#24132f,#15111e);border-radius:0 0 20px 20px;border-top:1px solid #7b3a8d;scroll-margin-top:20px}
.main-post>.inline-comments{margin-top:10px;border-radius:18px;border:1px solid #784285}
.inline-comments h3{font-size:13px;color:#f4dcff;margin:0 0 12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.inline-comments h3 span{font:8px monospace;color:#a7ffda;letter-spacing:1px}
.inline-row{display:flex;gap:8px;padding:8px 0;border-bottom:1px solid #ffffff0b;align-items:start}
.inline-row .avatar{width:27px;height:27px;flex-shrink:0;border-width:1px}
.inline-row strong{font-size:10px;color:#dfff39}
.inline-row p{font-size:12px;line-height:1.4;margin:3px 0;overflow-wrap:anywhere}
.inline-row>div{min-width:0}
.inline-comments form{display:flex;gap:6px;margin-top:13px}
.inline-comments input{min-width:0;flex:1;border:1px solid #825293;border-radius:16px;background:#33213f;color:white;padding:10px;font-size:11px}
.inline-comments form button{border-radius:16px;background:linear-gradient(#e4ff8b,#bcf600);color:#251330;padding:8px;font-size:10px;font-weight:bold}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
@media(max-width:700px){
    .canvas{padding:14px 10px}
    .player-wrap{width:100%;max-width:440px}
    .actions{margin-top:10px;position:static}
    .post-video video{max-height:75svh}
    .inline-comments{padding:12px 10px}
}

/* Compact TikTok-style action rails beside every media item. */
.canvas{padding-left:22px;padding-right:88px;overflow:visible}
.player-wrap{width:min(100%,420px)}
.post-stage{position:relative}
.feed-post{overflow:visible}
.post-top{border-radius:20px 20px 0 0}
.post-copy{border-radius:0}
.inline-comments{border-radius:0 0 20px 20px}
.post-stage>.actions,.post-stage>.action-rail{position:absolute;left:calc(100% + 13px);right:auto;top:50%;bottom:auto;transform:translateY(-50%);width:58px;margin:0;padding:9px 3px;display:flex;flex-direction:column;align-items:stretch;gap:13px;background:#13101de8;border-radius:25px;border:1px solid #ffffff12;box-shadow:0 3px 12px #17092533}
.post-stage>.actions .action,.action-rail button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:transparent;border:0;border-radius:0;padding:4px 0;color:white;min-width:0;font-size:8px;line-height:1.2;box-shadow:none}
.post-stage>.actions .symbol,.action-rail .rail-icon{font-size:24px;line-height:1}
.post-stage>.actions b,.action-rail b{font-size:8px;font-weight:700;white-space:nowrap}
.post-stage>.actions small{font-size:8px}
.action-rail button[aria-pressed=true]{background:transparent;color:#ff43c7}
.action-rail button[aria-pressed=true] .rail-icon{text-shadow:0 0 12px #ff19af}
.post-stage>.actions #more .symbol,.post-more .rail-icon{font-size:19px}
.main-post .player{box-shadow:0 0 0 2px #081019,0 0 0 4px #00bfff,5px 5px 0 #141322}
@media(max-width:700px){
    .canvas{padding:14px 72px 25px 10px}
    .player-wrap{width:100%;max-width:420px}
    .post-stage>.actions,.post-stage>.action-rail{left:calc(100% + 9px);width:51px;padding:9px 2px;gap:13px}
    .post-stage>.actions b,.action-rail b{font-size:7px}
    .post-stage>.actions .symbol,.action-rail .rail-icon{font-size:23px}
    .post-stage>.actions small{font-size:7px}
}

/* Overlay actions and author details directly on the media. */
.canvas{padding:28px 24px}
.player-wrap{width:min(100%,440px)}
.post-stage{border-radius:20px;isolation:isolate;overflow:hidden}
.main-post .post-stage{box-shadow:0 0 0 2px #00cfff}
.main-post .player{box-shadow:none;border-radius:20px}
.post-stage::after{content:'';position:absolute;inset:45% 0 0;z-index:1;pointer-events:none;background:linear-gradient(transparent,rgba(0,0,0,.72))}
.post-stage>.actions,.post-stage>.action-rail{left:auto;right:9px;top:auto;bottom:125px;transform:none;width:53px;padding:0;gap:18px;background:transparent;border:0;border-radius:0;box-shadow:none;z-index:5}
.post-stage>.actions .action,.action-rail button{color:white;text-shadow:0 2px 5px #000,0 0 9px #0008;gap:5px}
.post-stage>.actions .symbol,.action-rail .rail-icon{font-size:29px}
.post-stage>.actions b,.action-rail b{font-size:8px}
.post-stage>.actions small{font-size:10px}
.main-post .creator{display:none}
.post-stage>.creator-bar,.post-stage>.post-top{position:absolute;left:13px;right:70px;bottom:17px;padding:0;margin:0;z-index:4;background:transparent;box-shadow:none;border:0;border-radius:0;gap:8px;text-shadow:0 2px 5px #000}
.creator-bar{flex-wrap:wrap;justify-content:flex-start}
.creator-bar .avatar,.post-top .avatar{width:34px;height:34px;flex-shrink:0}
.creator-bar strong,.post-top strong{font-size:12px}
.creator-bar small,.post-top small{color:#eee;font-size:10px}
.creator-bar .pink{padding:7px 10px;font-size:10px;margin-left:auto;text-shadow:none}
.main-post .caption{bottom:83px;z-index:3;padding:8px 75px 6px 13px;background:transparent;text-shadow:0 2px 4px #000}
.caption p{font-size:13px;margin:0}
.post-stage>.post-copy{position:absolute;left:13px;right:75px;bottom:85px;padding:0;z-index:3;text-shadow:0 2px 5px #000}
.post-copy p{margin:0;font-size:13px}
.feed-post .post-stage:has(.post-video)>.post-top{bottom:48px}
.feed-post .post-stage:has(.post-video)>.post-copy{bottom:111px}
.post-photo img{min-height:350px;object-fit:cover}
.post-video video{border-radius:20px}
.inline-comments{border-radius:0 0 20px 20px}
.feed-post{border-radius:20px}
.post-stage>.post-top>span{display:none}
@media(max-width:700px){
    .canvas{padding:14px 10px 25px}
    .player-wrap{width:100%;max-width:440px}
    .post-stage>.actions,.post-stage>.action-rail{left:auto;right:6px;width:51px;bottom:125px;top:auto;padding:0;gap:16px}
    .post-stage>.actions .symbol,.action-rail .rail-icon{font-size:28px}
    .post-stage>.creator-bar,.post-stage>.post-top{left:11px;right:65px}
    .creator-bar .pink{font-size:9px;padding:7px 9px}
    .creator-bar strong,.post-top strong{font-size:11px}
    .post-photo img{min-height:350px}
}

/* Translucent controls over the media; discussions open on demand. */
.post-stage>.actions,.post-stage>.action-rail{background:rgba(18,14,29,.46);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);border:1px solid rgba(255,255,255,.13);border-radius:26px;padding:12px 3px;box-shadow:0 3px 12px rgba(0,0,0,.12)}
.rail-icon svg,.symbol svg{display:block;width:27px;height:27px;filter:drop-shadow(0 1px 2px #0006)}
@media(max-width:700px){
    .post-stage>.actions,.post-stage>.action-rail{padding:11px 2px}
    .rail-icon svg,.symbol svg{width:26px;height:26px}
}

/* ====== НОВЫЕ СТИЛИ ДЛЯ ВЫЕЗЖАЮЩИХ КОММЕНТАРИЕВ ====== */
.post-stage {
    position: relative;
    overflow: hidden; /* Важно для скругления углов */
    border-radius: 20px;
}

.inline-comments {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    max-height: 80%;
    background: linear-gradient(to top, #0d0d15 0%, #15111e 100%);
    border-radius: 20px 20px 0 0;
    transform: translateY(105%);
    transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    z-index: 20;
    box-shadow: 0 -5px 20px rgba(0,0,0,0.8);
    display: flex;
    flex-direction: column;
    padding: 0;
    border-top: 2px solid #00dfff;
    border-left: 1px solid #7b3a8d;
    border-right: 1px solid #7b3a8d;
    margin: 0;
}

.post-stage.comments-open .inline-comments {
    transform: translateY(0);
}

.inline-comments h3 {
    padding: 12px 15px;
    margin: 0;
    background: #1e1529;
    border-bottom: 1px solid #7b3a8d;
    border-radius: 20px 20px 0 0;
    font-size: 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-shrink: 0;
    color: #f4dcff;
}

.inline-comments h3 button.close-comments {
    background: none;
    border: none;
    color: #ff00c8;
    font-size: 20px;
    cursor: pointer;
    padding: 0 5px;
}

.comments-list {
    flex: 1;
    overflow-y: auto;
    padding: 10px 15px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    scrollbar-width: thin;
    scrollbar-color: #ff00c8 #15111e;
}

.comments-list::-webkit-scrollbar { width: 6px; }
.comments-list::-webkit-scrollbar-track { background: #15111e; }
.comments-list::-webkit-scrollbar-thumb { background-color: #ff00c8; border-radius: 3px; }

.comment-form {
    padding: 10px 15px;
    background: #1e1529;
    border-top: 1px solid #333;
    display: flex;
    gap: 8px;
    flex-shrink: 0;
}

.comment-form input {
    flex: 1;
    background: #2a1f35;
    border: 1px solid #5a3a6b;
    color: white;
    padding: 10px;
    border-radius: 20px;
    font-size: 13px;
}

.comment-form button {
    background: var(--pink);
    color: white;
    border: none;
    border-radius: 50%;
    width: 40px;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 16px;
}

@media (max-width: 700px) {
    .inline-comments { max-height: 85%; }
}
</style>
